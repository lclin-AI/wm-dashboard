<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>街市即日餸 — 時段 / Quota / 車線</title>
<style>
  :root{
    --bg:#f7f7f5; --card:#fff; --ink:#1c1c1a; --dim:#6b6b66; --line:#e2e2dd;
    --ok:#2e7d4f; --okbg:#e6f4ec; --bad:#c0392b; --badbg:#fbe9e7;
    --warn:#b26a00; --warnbg:#fdf0dd; --mute:#9a9a94; --mutebg:#efefec;
    --accent:#1f5fa8;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#16171a; --card:#1e2024; --ink:#e8e8e4; --dim:#9a9da3; --line:#2f3238;
    --ok:#6dd39a; --okbg:#173324; --bad:#ff8a7a; --badbg:#3a1d1a;
    --warn:#f0b45e; --warnbg:#3a2c15; --mute:#7b7f86; --mutebg:#24272c;
    --accent:#7fb0ec;
  }}
  :root[data-theme="dark"]{
    --bg:#16171a; --card:#1e2024; --ink:#e8e8e4; --dim:#9a9da3; --line:#2f3238;
    --ok:#6dd39a; --okbg:#173324; --bad:#ff8a7a; --badbg:#3a1d1a;
    --warn:#f0b45e; --warnbg:#3a2c15; --mute:#7b7f86; --mutebg:#24272c;
    --accent:#7fb0ec;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 -apple-system,"Segoe UI",system-ui,"Noto Sans HK",sans-serif}
  .wrap{max-width:1240px;margin:0 auto;padding-block:22px;padding-left:16px;padding-right:16px}
  h1{font-size:20px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:18px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:7px 13px;border-radius:999px;cursor:pointer;font-size:13px}
  .tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:14px;margin-bottom:16px}
  .meta{color:var(--dim);font-size:12px;margin-bottom:10px}
  .stale{color:var(--bad);font-weight:600}
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;font-size:12px;white-space:nowrap}
  th,td{border:1px solid var(--line);padding:4px 7px;text-align:center}
  th.row,td.row{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;
    font-weight:600;min-width:118px}
  thead th{background:var(--mutebg);font-weight:600;color:var(--dim)}
  thead th.today{color:var(--accent)}
  td.row.today{color:var(--accent)}
  .open{background:var(--okbg);color:var(--ok);font-weight:600}
  .gone{background:var(--badbg);color:var(--bad);font-weight:700}
  .cutoff{background:var(--mutebg);color:var(--mute)}
  .none{color:var(--mute)}
  .na{background:var(--mutebg);color:var(--mute)}
  thead th.na{color:var(--mute)}
  .nas{font-weight:400;font-size:10px;color:var(--mute)}
  .full{background:var(--badbg);color:var(--bad);font-weight:700}
  .tight{background:var(--warnbg);color:var(--warn);font-weight:600}
  .legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--dim);font-size:12px;margin-top:10px}
  .err{color:var(--bad)}
  .note{color:var(--dim);font-size:12px;margin-top:10px}
  .status{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .pill{border:1px solid var(--line);background:var(--card);border-radius:8px;
        padding:7px 11px;font-size:12px;line-height:1.35;min-width:150px}
  .pill .k{color:var(--dim);display:block;font-size:11px}
  .pill .v{font-weight:600}
  .pill.good{border-color:var(--ok)} .pill.good .v{color:var(--ok)}
  .pill.bad{border-color:var(--bad);background:var(--badbg)} .pill.bad .v{color:var(--bad)}
  .pill.idle .v{color:var(--mute)}
  .pill .s{color:var(--dim);font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <h1>街市即日餸 — 時段 / Quota / 車線</h1>
  <div class="sub" id="sub">載入中…</div>

  <div class="status" id="status"></div>

  <div class="tabs" role="tablist">
    <button role="tab" data-p="ts" aria-selected="true">落單時段</button>
    <button role="tab" data-p="dq" aria-selected="false">District Quota</button>
    <button role="tab" data-p="cl" aria-selected="false">車線 Carline</button>
  </div>

  <section class="card" id="p-ts"></section>
  <section class="card" id="p-dq" hidden></section>
  <section class="card" id="p-cl" hidden></section>
</div>

<script>
const NAME = {
  SMI00001:"士美菲路", TM00001:"屯門·新墟", KOWC00001:"九龍城", TPH00001:"大埔墟",
  TW00001:"荃灣·楊屋道", WAN00001:"灣仔", POR00001:"保安道",
  YL00001:"元朗·大橋", MCP00001:"將軍澳·尚德"
};
// OIX 內部叫 PM，lclin 同前線叫 PM1 —— 出畀人睇一律用 PM1
const TS = ["AM","PM1","PM2","EV"];
const SLOT2TS = {"10:00-12:30":"AM","13:00-15:30":"PM1","16:00-18:30":"PM2","18:00-20:30":"EV"};
const OIX2TS = {AM:"AM", PM:"PM1", PM2:"PM2", EV:"EV"};

const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const today = new Date().toISOString().slice(0,10);

async function load(f){
  const r = await fetch("data/" + f + "?t=" + Date.now());
  if(!r.ok) throw new Error(f + " " + r.status);
  return r.json();
}
function ago(iso){
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "啱啱";
  if (m < 60) return m + " 分鐘前";
  return Math.floor(m/60) + " 小時 " + (m%60) + " 分鐘前";
}
function metaLine(iso, staleMin){
  const m = (Date.now() - new Date(iso)) / 60000;
  const cls = m > staleMin ? " class=\"stale\"" : "";
  return "<div class=\"meta\">更新：" + esc(iso.replace("T"," ")) +
         "　<span" + cls + ">（" + ago(iso) + "）</span></div>";
}
function sortCodes(list){
  return list.slice().sort((a,b) => (NAME[a]||a).localeCompare(NAME[b]||b, "zh-HK"));
}

/* ── 共用：街市做行，日期下面再分四個時段 ────────────────── */
function grid(dates, codes, cell){
  let h = "<div class=\"scroll\"><table><thead><tr><th class=\"row\">街市</th>";
  dates.forEach(dt => h += "<th class=\"" + (dt===today?"today":"") +
    "\" colspan=\"4\">" + dt.slice(5) + "</th>");
  h += "</tr><tr><th class=\"row\"></th>";
  dates.forEach(dt => TS.forEach(t =>
    h += "<th class=\"" + (dt===today?"today":"") + "\">" + t + "</th>"));
  h += "</tr></thead><tbody>";
  codes.forEach(code => {
    h += "<tr><td class=\"row\">" + esc(NAME[code]||code) + "</td>";
    dates.forEach(dt => TS.forEach(t => {
      const c = cell(code, dt, t);
      h += "<td class=\"" + (c.cls||"") + "\" title=\"" + esc(c.tip||"") + "\">" +
           c.txt + "</td>";
    }));
    h += "</tr>";
  });
  return h + "</tbody></table></div>";
}

/* 打橫轉：日期做行、街市做欄（街市下面再分四個時段）。
   District Quota 同車線有 15 日 —— 日期做欄就變 60 欄，一定要捲到天光。
   反轉之後得 24 欄，一版睇得晒，而且日期一行一行落嚟符合睇日曆嘅直覺。 */
function gridT(dates, codes, cell, na){
  let h = "<div class=\"scroll\"><table><thead><tr><th class=\"row\">日期</th>";
  codes.forEach(code => h += "<th colspan=\"4\"" + (na && na.has(code) ? " class=\"na\"" : "") +
    ">" + esc(NAME[code]||code) + (na && na.has(code) ? "<br><span class=\"nas\">OIX 未有</span>" : "") + "</th>");
  h += "</tr><tr><th class=\"row\"></th>";
  codes.forEach(() => TS.forEach(t => h += "<th>" + t + "</th>"));
  h += "</tr></thead><tbody>";
  dates.forEach(dt => {
    const cls = dt === today ? " today" : "";
    h += "<tr><td class=\"row" + cls + "\">" + dt.slice(5) +
         (dt === today ? "（今日）" : "") + "</td>";
    codes.forEach(code => TS.forEach(t => {
      const c = cell(code, dt, t);
      h += "<td class=\"" + (c.cls||"") + "\" title=\"" + esc(c.tip||"") + "\">" +
           c.txt + "</td>";
    }));
    h += "</tr>";
  });
  return h + "</tbody></table></div>";
}

/* ── 1. 落單時段 ─────────────────────────────────────────── */
function renderTS(d){
  const dates = [...new Set(d.cells.map(c=>c.date))].sort();
  const codes = sortCodes([...new Set(d.cells.map(c=>c.code))]);
  const by = {};
  d.cells.forEach(c => by[c.code + "|" + c.date + "|" + SLOT2TS[c.slot]] = c);
  const TXT = {open:"有", gone:"冇", cutoff:"截", none:"–"};
  let h = metaLine(d.updatedAt, 5);
  h += grid(dates, codes, (code, dt, t) => {
    const c = by[code + "|" + dt + "|" + t];
    const st = c ? c.status : "none";
    return {cls: st, txt: TXT[st], tip: c ? "截單 " + c.cutoff.replace("T"," ") : ""};
  });
  h += "<div class=\"legend\">" +
       "<span><b class=\"open\">有</b> 揀得到</span>" +
       "<span><b class=\"gone\">冇</b> 截單前冇咗（爆）</span>" +
       "<span><b class=\"cutoff\">截</b> 過咗截單（正常）</span>" +
       "<span><b>–</b> 呢格根本冇開過</span></div>";
  h += "<div class=\"note\">九個街市都有。數據嚟自監察程式每分鐘查嘅實際落單頁，" +
       "逐個街市用對應地址查（時段跟 account 嘅 default 送貨地址行）。</div>";
  el("p-ts").innerHTML = h;
}

/* ── 2. District Quota ───────────────────────────────────── */
function renderDQ(d){
  const dates = [...new Set(d.cells.map(c=>c.date))].sort();
  const codes = sortCodes([...new Set(d.cells.map(c=>c.code))]);
  const by = {};
  d.cells.forEach(c => by[c.code + "|" + c.date + "|" + OIX2TS[c.ts]] = c);
  let h = metaLine(d.updatedAt, 60);
  const naDQ = new Set(d.cells.filter(c => c.inOix === false).map(c => c.code));
  const naCL2 = naDQ;
  h += gridT(dates, codes, (code, dt, t) => {
    const c = by[code + "|" + dt + "|" + t];
    if(!c) return {cls:"none", txt:"–"};
    if(c.inOix === false) return {cls:"na", txt:"—", tip:"OIX 未有呢個 district"};
    const r = c.quota ? c.used / c.quota : 0;
    return {cls: c.used >= c.quota ? "full" : (r >= 0.9 ? "tight" : ""),
            txt: c.used + "/" + c.quota,
            tip: "用咗 " + c.used + "，配額 " + c.quota};
  }, naDQ);
  h += "<div class=\"legend\">" +
       "<span><b class=\"full\">紅</b> 已用爆（≥ 配額）</span>" +
       "<span><b class=\"tight\">橙</b> 用咗 9 成或以上</span>" +
       "<span><b class=\"na\">—</b> OIX 未有呢個街市</span>" +
       "<span><b>–</b> OIX 冇呢格</span></div>";
  h += "<div class=\"note\">用量 ＝ 已使用配額 ＋ 已使用臨時配額。" +
       (naCL2.size ? "標住「OIX 未有」嗰 " + naCL2.size +
        " 個街市喺 OIX 冇對應 district，攞唔到數；佢哋一上（同一個 code）呢度就會自動出數。"
        : "九個街市全部喺 OIX 攞到數。") + "</div>";
  el("p-dq").innerHTML = h;
}

/* ── 3. 車線 ─────────────────────────────────────────────── */
function renderCL(d){
  const dates = [...new Set(d.cells.map(c=>c.date))].sort();
  const codes = sortCodes([...new Set(d.cells.map(c=>c.code))]);
  const by = {};
  d.cells.forEach(c => by[c.code + "|" + c.date + "|" + OIX2TS[c.ts]] = c);
  let miss = 0;
  let h = metaLine(d.updatedAt, 24*60);
  const naCL = new Set(d.cells.filter(c => c.inOix === false).map(c => c.code));
  h += gridT(dates, codes, (code, dt, t) => {
    const c = by[code + "|" + dt + "|" + t];
    if(c && c.inOix === false) return {cls:"na", txt:"—", tip:"OIX 未有呢個 district"};
    const ok = !!(c && c.ok);
    if(!ok) miss++;                       // N/A 唔計落「未上」，佢唔係漏咗
    return {cls: ok ? "open" : "gone", txt: ok ? "☑" : "☐",
            tip: c ? "rows=" + c.rows + " routes=" + c.routes : ""};
  }, naCL);
  h += "<div class=\"legend\"><span><b class=\"open\">☑</b> 車線已上</span>" +
       "<span><b class=\"gone\">☐</b> 未上</span>" +
       "<span><b class=\"na\">—</b> OIX 未有呢個街市</span></div>";
  const latest = Object.entries(d.districtLatest||{})
    .filter(([c,v]) => v && v !== "NONE")
    .map(([c,v]) => esc(NAME[c]||c) + " " + esc(v)).join("、");
  h += "<div class=\"note\">未上：<b>" + miss + "</b> 格" +
       (naCL.size ? "（標住「OIX 未有」嗰 " + naCL.size + " 個街市唔計入內）" : "") +
       "。各街市車線實際上到：" + latest + "。</div>";
  el("p-cl").innerHTML = h;
}

/* ── 0. 狀態列 ───────────────────────────────────────────── */
function minsAgo(iso){ return iso ? (Date.now() - new Date(iso)) / 60000 : null; }
function hhmm(iso){ return iso ? iso.slice(11,16) : "—"; }
function pill(cls, k, v, s){
  return "<div class=\"pill " + cls + "\"><span class=\"k\">" + esc(k) + "</span>" +
         "<span class=\"v\">" + esc(v) + "</span>" +
         (s ? "<span class=\"s\"><br>" + esc(s) + "</span>" : "") + "</div>";
}
function renderStatus(h){
  const p = [];

  // 監察程式 —— 每分鐘一輪。
  // ⚠ 一定要用「collect 抄嗰刻」減「monitor 最後一輪」嚟量，唔可以用瀏覽器而家：
  //   個站係靜態檔，monitor 寫完到你見到，中間有 task 間隔（5 分鐘）＋ push
  //   ＋ Pages 部署 ＋ 頁面 reload，加埋隨時 8 分鐘。用瀏覽器時間去減就一定
  //   誤報「停咗」——2026-09-14 就係咁報咗一次假警。
  const base = h.collectedAt ? new Date(h.collectedAt) : new Date();
  const lag = h.updatedAt ? (base - new Date(h.updatedAt)) / 60000 : null;
  const monStale = lag === null || lag > 5;
  p.push(pill(monStale ? "bad" : "good", "監察程式",
    monStale ? "停咗？" : "行緊",
    (h.updatedAt ? "最後一輪 " + hhmm(h.updatedAt) : "冇數據")
    + "　" + (h.marketsChecked || 0) + "/" + (h.marketsTotal || 0) + " 個街市"
    + (h.blownCount ? "　爆緊 " + h.blownCount + " 格" : "")));

  // 推送鏈 —— collect + push 每 5 分鐘一次。呢個死咗，成版嘢就會靜靜雞停喺舊數。
  const cAge = minsAgo(h.collectedAt);
  const pushDead = cAge === null || cAge > 15;
  p.push(pill(pushDead ? "bad" : "good", "數據推送",
    pushDead ? (cAge === null ? "舊版數據" : "停咗？") : "正常",
    h.collectedAt ? hhmm(h.collectedAt) + "　" + ago(h.collectedAt) + "　每 5 分鐘一次"
                  : "status.json 冇 collectedAt"));

  // WhatsApp 連線 —— 每 15 分鐘 headless 開 .wa-profile 真查一次
  const c = h.whatsappConn;
  const ST = {logged_in:"連得上", logged_out:"登出咗！", timeout:"連唔上",
              error:"檢查出錯", check_failed:"檢查行唔到"};
  if (!c) {
    p.push(pill("idle", "WhatsApp 連線", "未查過", "monitor 開機後 15 分鐘內會查"));
  } else {
    // 同樣用 collectedAt 做基準（唔係瀏覽器而家）—— 推送鏈嘅延遲唔應該
    // 算落「check 停咗」度。15 分鐘一次，超過 40 分鐘就係真係冇再查。
    const cs = c.at ? (base - new Date(c.at)) / 60000 : null;
    const old = cs === null || cs > 40;
    p.push(pill(c.ok && !old ? "good" : "bad", "WhatsApp 連線",
      old && c.ok ? "check 停咗" : (ST[c.state] || c.state),
      hhmm(c.at) + "　" + ago(c.at) + (c.note ? "　" + c.note.slice(0, 22) : "")));
  }

  // 最後一次發送 —— 同「連唔連得上」係兩件事，唔好夾埋
  const w = h.lastWhatsApp;
  if (!w) {
    p.push(pill("idle", "WhatsApp 最後發送", "未發過",
                "冇 alert 就唔會發，唔代表有問題"));
  } else {
    p.push(pill(w.ok ? "good" : "bad", "WhatsApp 最後發送",
      w.ok ? "成功" : "失敗 (rc=" + w.rc + ")",
      hhmm(w.at) + "　" + ago(w.at) + (w.head ? "　" + w.head.slice(0, 18) : "")));
  }

  // Slack —— 第二通道。WhatsApp 登出嗰種故障冇得靠 WhatsApp 自己通知，
  // 所以呢格要同 WhatsApp 分開睇：一邊紅一邊綠先知邊條通道死咗。
  const sl = h.lastSlack;
  if (!sl) {
    p.push(pill("idle", "Slack 最後發送", "未發過",
                "#express-wm-quota-alert　冇 alert 就唔會發"));
  } else {
    p.push(pill(sl.ok ? "good" : "bad", "Slack 最後發送",
      sl.ok ? "成功" : "失敗",
      hhmm(sl.at) + "　" + ago(sl.at) +
      (sl.note ? "　" + sl.note.slice(0, 30) : "　#express-wm-quota-alert")));
  }

  // OIX
  const o = h.oixOk;
  p.push(pill(o === true ? "good" : (o === false ? "bad" : "idle"), "OIX 登入",
    o === true ? "正常" : (o === false ? "叫唔到" : "未知"),
    o === false ? "delivery quota 數字出唔到" : "District Quota 攞得到數"));

  // 車線檢查 —— 一日一次，超過 26 個鐘就係冇跑過
  const cr = h.carlineCheckedAt ? (base - new Date(h.carlineCheckedAt)) / 60000 : null;
  const clStale = cr === null || cr > 26 * 60;      // 一日一次，26 個鐘先算過期
  p.push(pill(clStale ? "bad" : "good", "車線檢查 (T+0..T+2)",
    clStale ? "未跑過 / 過期" : "正常",
    h.carlineCheckedAt ? hhmm(h.carlineCheckedAt) + "　" + ago(h.carlineCheckedAt)
                       : "monitor 開機後會跑第一次"));

  el("status").innerHTML = p.join("");
}

/* ── tabs ───────────────────────────────────────────────── */
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x =>
    x.setAttribute("aria-selected", String(x === b)));
  ["ts","dq","cl"].forEach(p => el("p-" + p).hidden = (p !== b.dataset.p));
});

async function refresh(){
  const jobs = [["timeslots.json", renderTS, "p-ts"],
                ["district.json", renderDQ, "p-dq"],
                ["carline.json", renderCL, "p-cl"]];
  const times = [];
  for (const [f, fn, id] of jobs) {
    try { const d = await load(f); fn(d); times.push(d.updatedAt); }
    catch (e) { el(id).innerHTML = "<div class=\"err\">載入 " + esc(f) + " 失敗：" + esc(e.message) + "</div>"; }
  }
  try { renderStatus(await load("status.json")); }
  catch (e) { el("status").innerHTML = "<div class=\"err\">載入 status.json 失敗：" + esc(e.message) + "</div>"; }

  el("sub").textContent =
    (times.length ? "最新一份數據：" + times.sort().slice(-1)[0].replace("T"," ") : "冇數據")
    + "　·　本頁 " + new Date().toTimeString().slice(0,8) + " 載入，每 2 分鐘自動 reload";
}
refresh();
// 個站係靜態檔，數據由 Task Scheduler 每 5 分鐘 push 上嚟。自己定時重讀，
// 唔使人手 refresh 都見到最新（同埋「幾耐之前」個計時會跟住行）。
setInterval(refresh, 120000);
</script>
</body>
</html>
