<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>街市即日餸 — 時段 / Quota / 車線</title>
<style>
  :root{
    --bg:#f7f7f5; --card:#fff; --ink:#1c1c1a; --dim:#6b6b66; --line:#e2e2dd;
    --ok:#2e7d4f; --okbg:#e6f4ec; --bad:#c0392b; --badbg:#fbe9e7;
    --warn:#b26a00; --warnbg:#fdf0dd; --mute:#9a9a94; --mutebg:#efefec;
    --accent:#1f5fa8;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#16171a; --card:#1e2024; --ink:#e8e8e4; --dim:#9a9da3; --line:#2f3238;
    --ok:#6dd39a; --okbg:#173324; --bad:#ff8a7a; --badbg:#3a1d1a;
    --warn:#f0b45e; --warnbg:#3a2c15; --mute:#7b7f86; --mutebg:#24272c;
    --accent:#7fb0ec;
  }}
  :root[data-theme="dark"]{
    --bg:#16171a; --card:#1e2024; --ink:#e8e8e4; --dim:#9a9da3; --line:#2f3238;
    --ok:#6dd39a; --okbg:#173324; --bad:#ff8a7a; --badbg:#3a1d1a;
    --warn:#f0b45e; --warnbg:#3a2c15; --mute:#7b7f86; --mutebg:#24272c;
    --accent:#7fb0ec;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 -apple-system,"Segoe UI",system-ui,"Noto Sans HK",sans-serif}
  .wrap{max-width:1240px;margin:0 auto;padding-block:22px;padding-left:16px;padding-right:16px}
  h1{font-size:20px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:18px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:7px 13px;border-radius:999px;cursor:pointer;font-size:13px}
  .tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:14px;margin-bottom:16px}
  .meta{color:var(--dim);font-size:12px;margin-bottom:10px}
  .stale{color:var(--bad);font-weight:600}
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;font-size:12px;white-space:nowrap}
  th,td{border:1px solid var(--line);padding:4px 7px;text-align:center}
  th.row,td.row{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;
    font-weight:600;min-width:118px}
  thead th{background:var(--mutebg);font-weight:600;color:var(--dim)}
  thead th.today{color:var(--accent)}
  .open{background:var(--okbg);color:var(--ok);font-weight:600}
  .gone{background:var(--badbg);color:var(--bad);font-weight:700}
  .cutoff{background:var(--mutebg);color:var(--mute)}
  .none{color:var(--mute)}
  .full{background:var(--badbg);color:var(--bad);font-weight:700}
  .tight{background:var(--warnbg);color:var(--warn);font-weight:600}
  .legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--dim);font-size:12px;margin-top:10px}
  .err{color:var(--bad)}
  .note{color:var(--dim);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>街市即日餸 — 時段 / Quota / 車線</h1>
  <div class="sub" id="sub">載入中…</div>

  <div class="tabs" role="tablist">
    <button role="tab" data-p="ts" aria-selected="true">落單時段</button>
    <button role="tab" data-p="dq" aria-selected="false">District Quota</button>
    <button role="tab" data-p="cl" aria-selected="false">車線 Carline</button>
  </div>

  <section class="card" id="p-ts"></section>
  <section class="card" id="p-dq" hidden></section>
  <section class="card" id="p-cl" hidden></section>
</div>

<script>
const NAME = {
  SMI00001:"士美菲路", TM00001:"屯門·新墟", KOWC00001:"九龍城", TPH00001:"大埔墟",
  TW00001:"荃灣·楊屋道", WAN00001:"灣仔", POR00001:"保安道",
  YL00001:"元朗·大橋", MCP00001:"將軍澳·尚德"
};
// OIX 內部叫 PM，lclin 同前線叫 PM1 —— 出畀人睇一律用 PM1
const TS = ["AM","PM1","PM2","EV"];
const SLOT2TS = {"10:00-12:30":"AM","13:00-15:30":"PM1","16:00-18:30":"PM2","18:00-20:30":"EV"};
const OIX2TS = {AM:"AM", PM:"PM1", PM2:"PM2", EV:"EV"};

const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const today = new Date().toISOString().slice(0,10);

async function load(f){
  const r = await fetch("data/" + f + "?t=" + Date.now());
  if(!r.ok) throw new Error(f + " " + r.status);
  return r.json();
}
function ago(iso){
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "啱啱";
  if (m < 60) return m + " 分鐘前";
  return Math.floor(m/60) + " 小時 " + (m%60) + " 分鐘前";
}
function metaLine(iso, staleMin){
  const m = (Date.now() - new Date(iso)) / 60000;
  const cls = m > staleMin ? " class=\"stale\"" : "";
  return "<div class=\"meta\">更新：" + esc(iso.replace("T"," ")) +
         "　<span" + cls + ">（" + ago(iso) + "）</span></div>";
}
function dayCols(dates){
  return dates.map(d => "<th class=\"" + (d===today?"today":"") + "\">" + d.slice(5) + "</th>").join("");
}
function sortCodes(list){
  return list.slice().sort((a,b) => (NAME[a]||a).localeCompare(NAME[b]||b, "zh-HK"));
}

/* ── 1. 落單時段 ─────────────────────────────────────────── */
function renderTS(d){
  const dates = [...new Set(d.cells.map(c=>c.date))].sort();
  const codes = sortCodes([...new Set(d.cells.map(c=>c.code))]);
  const by = {};
  d.cells.forEach(c => by[c.code + "|" + c.date + "|" + SLOT2TS[c.slot]] = c);
  const TXT = {open:"有", gone:"冇", cutoff:"截", none:"–"};
  let h = metaLine(d.updatedAt, 5);
  h += "<div class=\"scroll\"><table><thead><tr><th class=\"row\">街市</th>";
  dates.forEach(dt => h += "<th class=\"" + (dt===today?"today":"") + "\" colspan=\"4\">" + dt.slice(5) + "</th>");
  h += "</tr><tr><th class=\"row\"></th>";
  dates.forEach(() => TS.forEach(t => h += "<th>" + t + "</th>"));
  h += "</tr></thead><tbody>";
  codes.forEach(code => {
    h += "<tr><td class=\"row\">" + esc(NAME[code]||code) + "</td>";
    dates.forEach(dt => TS.forEach(t => {
      const c = by[code + "|" + dt + "|" + t];
      const st = c ? c.status : "none";
      const tip = c ? "截單 " + c.cutoff.replace("T"," ") : "";
      h += "<td class=\"" + st + "\" title=\"" + esc(tip) + "\">" + TXT[st] + "</td>";
    }));
    h += "</tr>";
  });
  h += "</tbody></table></div>";
  h += "<div class=\"legend\">" +
       "<span><b class=\"open\">有</b> 揀得到</span>" +
       "<span><b class=\"gone\">冇</b> 截單前冇咗（爆）</span>" +
       "<span><b class=\"cutoff\">截</b> 過咗截單（正常）</span>" +
       "<span><b>–</b> 呢格根本冇開過</span></div>";
  h += "<div class=\"note\">九個街市都有。數據嚟自監察程式每分鐘查嘅實際落單頁，" +
       "逐個街市用對應地址查（時段跟 account 嘅 default 送貨地址行）。</div>";
  el("p-ts").innerHTML = h;
}

/* ── 2. District Quota ───────────────────────────────────── */
function renderDQ(d){
  const dates = [...new Set(d.cells.map(c=>c.date))].sort();
  const codes = sortCodes([...new Set(d.cells.map(c=>c.code))]);
  const by = {};
  d.cells.forEach(c => by[c.code + "|" + c.date + "|" + OIX2TS[c.ts]] = c);
  let h = metaLine(d.updatedAt, 60);
  h += "<div class=\"scroll\"><table><thead><tr><th class=\"row\">街市 / 時段</th>" +
       dayCols(dates) + "</tr></thead><tbody>";
  codes.forEach(code => TS.forEach(t => {
    h += "<tr><td class=\"row\">" + esc(NAME[code]||code) + " " + t + "</td>";
    dates.forEach(dt => {
      const c = by[code + "|" + dt + "|" + t];
      if(!c){ h += "<td class=\"none\">–</td>"; return; }
      const r = c.quota ? c.used / c.quota : 0;
      const cls = c.used >= c.quota ? "full" : (r >= 0.9 ? "tight" : "");
      h += "<td class=\"" + cls + "\">" + c.used + "/" + c.quota + "</td>";
    });
    h += "</tr>";
  }));
  h += "</tbody></table></div>";
  h += "<div class=\"legend\">" +
       "<span><b class=\"full\">紅</b> 已用爆（≥ 配額）</span>" +
       "<span><b class=\"tight\">橙</b> 用咗 9 成或以上</span>" +
       "<span><b>–</b> OIX 冇呢格</span></div>";
  h += "<div class=\"note\">用量 ＝ 已使用配額 ＋ 已使用臨時配額。" +
       "<b>只有六個街市</b> —— 屯門、大埔墟、元朗喺 OIX 冇對應 district，攞唔到數。</div>";
  el("p-dq").innerHTML = h;
}

/* ── 3. 車線 ─────────────────────────────────────────────── */
function renderCL(d){
  const dates = [...new Set(d.cells.map(c=>c.date))].sort();
  const codes = sortCodes([...new Set(d.cells.map(c=>c.code))]);
  const by = {};
  d.cells.forEach(c => by[c.code + "|" + c.date + "|" + OIX2TS[c.ts]] = c);
  let miss = 0;
  let h = metaLine(d.updatedAt, 24*60);
  h += "<div class=\"scroll\"><table><thead><tr><th class=\"row\">街市 / 時段</th>" +
       dayCols(dates) + "</tr></thead><tbody>";
  codes.forEach(code => TS.forEach(t => {
    h += "<tr><td class=\"row\">" + esc(NAME[code]||code) + " " + t + "</td>";
    dates.forEach(dt => {
      const c = by[code + "|" + dt + "|" + t];
      const ok = !!(c && c.ok);
      if(!ok) miss++;
      const tip = c ? "rows=" + c.rows + " routes=" + c.routes : "";
      h += "<td class=\"" + (ok?"open":"gone") + "\" title=\"" + esc(tip) + "\">" +
           (ok ? "☑" : "☐") + "</td>";
    });
    h += "</tr>";
  }));
  h += "</tbody></table></div>";
  h += "<div class=\"legend\"><span><b class=\"open\">☑</b> 車線已上</span>" +
       "<span><b class=\"gone\">☐</b> 未上</span></div>";
  h += "<div class=\"note\">未上：<b>" + miss + "</b> 格。各街市車線實際上到：" +
       Object.entries(d.districtLatest||{})
         .map(([c,v]) => esc(NAME[c]||c) + " " + esc(v)).join("、") +
       "。<b>只有六個街市</b>（同 District Quota 一樣）。</div>";
  el("p-cl").innerHTML = h;
}

/* ── tabs ───────────────────────────────────────────────── */
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x =>
    x.setAttribute("aria-selected", String(x === b)));
  ["ts","dq","cl"].forEach(p => el("p-" + p).hidden = (p !== b.dataset.p));
});

(async () => {
  const jobs = [["timeslots.json", renderTS, "p-ts"],
                ["district.json", renderDQ, "p-dq"],
                ["carline.json", renderCL, "p-cl"]];
  const times = [];
  for (const [f, fn, id] of jobs) {
    try { const d = await load(f); fn(d); times.push(d.updatedAt); }
    catch (e) { el(id).innerHTML = "<div class=\"err\">載入 " + esc(f) + " 失敗：" + esc(e.message) + "</div>"; }
  }
  el("sub").textContent = times.length
    ? "最新一份數據：" + times.sort().slice(-1)[0].replace("T"," ")
    : "冇數據";
})();
</script>
</body>
</html>
